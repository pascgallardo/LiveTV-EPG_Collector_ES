<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U Links Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
            integrity="sha384-JUh163oCRItcbPme8pYnROHQMC6fNKTBWtRG3I3I0erJkzNgL7uxKlNwcrcFKeqF"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #1a1a1a;
            color: #fff;
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }
        body.light { background: #f4f4f4; color: #333; }
        body.pool { background: #0a0f1a; color: #00ffcc; }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 0;
            background: linear-gradient(45deg, #ff007a, #00ddeb);
            color: white;
            border-radius: 0 0 20px 20px;
        }
        header h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            animation: fadeIn 1s ease-in;
        }
        header p { font-size: 1.3em; }
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: inherit;
        }
        .search-bar {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        #search {
            padding: 12px;
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            background: #333;
            color: #fff;
            transition: background 0.3s;
        }
        body.light #search { background: #ddd; color: #333; }
        body.pool #search { background: #1a2a3a; border: 1px solid #ff007a; }
        .dropdown-section { margin: 20px 0; }
        select {
            width: 100%;
            max-width: 300px;
            padding: 10px;
            background: #2a2a2a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
        }
        body.light select { background: #fff; color: #333; }
        body.pool select { background: #1a2a3a; border: 1px solid #00ddeb; }
        .card {
            display: none;
            background: #2a2a2a;
            border-radius: 15px;
            padding: 15px;
            margin-top: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card.active { display: block; }
        body.light .card { background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        body.pool .card { background: #1a2a3a; box-shadow: 0 0 15px rgba(255, 0, 122, 0.5); }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        .link-item {
            padding: 10px;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        body.light .link-item { border-bottom: 1px solid #ccc; }
        body.pool .link-item { border-bottom: 1px solid #00ddeb; }
        .link-item a { color: #00ddeb; text-decoration: none; }
        .status-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }
        .status-online { background: #00ff00; }
        .status-offline { background: #ff0000; }
        .copy-btn, .download-btn {
            background: #ff007a;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            margin-left: 5px;
        }
        .copy-btn:hover, .download-btn:hover { background: #e6006b; }
        .analytics {
            margin: 40px 0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            background: #2a2a2a;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        body.light .analytics { background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        body.pool .analytics { background: #1a2a3a; box-shadow: 0 0 15px rgba(255, 0, 122, 0.3); }
        .analytics-left, .analytics-right {
            flex: 1;
            min-width: 300px;
            padding: 10px;
        }
        .analytics-left h2, .analytics-right h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #00ddeb;
        }
        .gauge {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            position: relative;
        }
        .gauge-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2em;
            font-weight: 600;
        }
        .line-chart { max-width: 100%; margin: 20px 0; }
        .search-summary { margin-bottom: 12px; font-size: 0.95em; color: #aaa; }
        .search-list { list-style: none; }
        .search-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .search-list li:last-child { border-bottom: none; }
        .search-list li > span:first-of-type { flex: 1; font-size: 0.9em; color: #999; }
        .search-count { font-size: 0.85em; color: #888; white-space: nowrap; }
        body.light .search-list li { border-color: rgba(0, 0, 0, 0.08); }
        .leaderboard { margin: 20px 0; }
        .leaderboard-item { padding: 5px 0; display: flex; justify-content: space-between; }
        .export-btn {
            background: #00ddeb;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
            display: block;
            margin: 20px auto;
        }
        .export-btn:hover { background: #00b8c9; }
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ddeb;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: none;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 0.9em;
            color: #888;
        }
        @media (max-width: 600px) {
            header h1 { font-size: 1.8em; }
            header p { font-size: 1em; }
            select { max-width: 100%; }
            .link-item { flex-direction: column; align-items: flex-start; }
            .copy-btn, .download-btn { margin-top: 5px; }
            .analytics { flex-direction: column; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <header>
        <button class="theme-toggle" onclick="toggleTheme()">☀️</button>
        <h1>M3U Links Hub</h1>
        <p>Global Live TV & Movies Playlists</p>
    </header>
    <div class="container">
        <div class="search-bar">
            <input type="text" id="search" placeholder="Search channels or movies..." onkeyup="searchContent()">
        </div>
        <div class="dropdown-section">
            <h2>Live TV</h2>
            <select id="live-tv-select" onchange="showLiveTV(this.value)">
                <option value="">Select Country</option>
            </select>
            <div id="live-tv-content" class="card"></div>
        </div>
        <div class="dropdown-section">
            <h2>Movies</h2>
            <select id="movies-select" onchange="showMovies(this.value)">
                <option value="">Select Category</option>
            </select>
            <div id="movies-content" class="card"></div>
        </div>
        <div class="analytics">
            <div class="analytics-left">
                <h2>Global Analytics</h2>
                <div id="gauges-container"></div>
                <div class="leaderboard" id="leaderboard"></div>
            </div>
            <div class="analytics-right">
                <h2>Download Trends</h2>
                <canvas id="downloadChart" class="line-chart"></canvas>
                <button class="export-btn" onclick="exportStats()">Download Stats (CSV)</button>
            </div>
        </div>
    </div>
    <div class="notification" id="notification"></div>
    <footer>
        Powered by <a href="https://github.com/bugsfreeweb/LiveTVCollector" target="_blank" rel="noopener">M3U Collector</a> | Playlists refreshed daily &middot; <span id="footer-updated">last update: &mdash;</span>
    </footer>

    <script>
        // Candidate data sources, in priority order: this fork first, upstream as fallback.
        const RAW_BASES = [
            'https://raw.githubusercontent.com/pascgallardo/LiveTVCollectorES/main/',
            'https://raw.githubusercontent.com/bugsfreeweb/LiveTVCollector/main/'
        ];
        let rawBaseUrl = RAW_BASES[0];
        let baseUrl = '/';

        const STORE_KEYS = { analytics: 'm3u_analytics', downloads: 'download_history', status: 'm3u_status', theme: 'm3u_theme' };

        // Persisted click/copy/download counters. Totals are derived, never stored.
        const storedAnalytics = JSON.parse(localStorage.getItem(STORE_KEYS.analytics) || 'null') || {};
        let analytics = {
            liveTv: storedAnalytics.liveTv || {},
            movies: storedAnalytics.movies || {},
            totalChannels: 0,
            lastSync: storedAnalytics.lastSync || {}
        };
        let contentMap = { liveTv: {}, movies: {} };
        let downloadHistory = JSON.parse(localStorage.getItem(STORE_KEYS.downloads) || '[]');
        let statusCache = JSON.parse(localStorage.getItem(STORE_KEYS.status) || '{}');
        const charts = {};

        function persistAnalytics() {
            localStorage.setItem(STORE_KEYS.analytics, JSON.stringify(analytics));
        }

        function sectionKey(dir) {
            return dir === 'LiveTV' ? 'liveTv' : 'movies';
        }

        function fileBaseName(dir, name) {
            return dir === 'LiveTV' ? name : name.replace('LiveTV', 'Movies');
        }

        function fileUrl(dir, subDir, file) {
            return `${rawBaseUrl}${dir}/${encodeURIComponent(subDir)}/${file}`;
        }

        async function fetchJson(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (err) {
                console.error(`Failed to fetch ${url}:`, err);
                return null;
            }
        }

        async function checkStatus(url) {
            // Cross-origin stream URLs rarely allow CORS, so a no-cors request is the only
            // option. An opaque response still means the server answered; the badge therefore
            // reports "reachable", not "the stream is valid".
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 5000);
            try {
                const response = await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
                return response.type === 'opaque' || response.ok;
            } catch {
                return false;
            } finally {
                clearTimeout(timer);
            }
        }

        async function resolveBaseUrl() {
            for (const base of RAW_BASES) {
                try {
                    const response = await fetch(`${base}LiveTV/index.json`, { method: 'GET' });
                    if (response.ok) return base;
                } catch {
                    // Try the next candidate
                }
            }
            return null;
        }

        function allChannelsOf(json) {
            return Object.values(json.channels || {}).flat();
        }

        // Totals are always derived from the loaded data, so they cannot drift between visits.
        function recomputeTotals() {
            let total = 0;
            for (const section of Object.values(contentMap)) {
                for (const json of Object.values(section)) {
                    total += allChannelsOf(json).length;
                }
            }
            analytics.totalChannels = total;
        }

        async function loadSection(kind) {
            const dir = kind === 'liveTv' ? 'LiveTV' : 'Movies';
            const select = document.getElementById(kind === 'liveTv' ? 'live-tv-select' : 'movies-select');
            const index = await fetchJson(`${rawBaseUrl}${dir}/index.json`);
            if (!Array.isArray(index) || index.length === 0) {
                select.disabled = true;
                select.options[0].textContent = `No ${dir} data available`;
                return;
            }
            const pending = [];
            for (const subDir of index) {
                const option = document.createElement('option');
                option.value = subDir;
                option.textContent = subDir;
                select.appendChild(option);
                const json = await fetchJson(fileUrl(dir, subDir, fileBaseName(dir, 'LiveTV.json')));
                if (!json) continue;
                contentMap[kind][subDir] = json;
                const key = `${dir}/${subDir}`;
                analytics.lastSync[key] = json.date;
                const cached = statusCache[key];
                if (cached && Date.now() - cached.timestamp < 3600000) continue;
                const sample = allChannelsOf(json).find(ch => ch.url);
                pending.push(
                    checkStatus(sample ? sample.url : '').then(online => {
                        statusCache[key] = { online: sample ? online : false, timestamp: Date.now() };
                    })
                );
            }
            // Run the reachability probes in parallel instead of one country at a time.
            await Promise.all(pending);
            notifyUpdates();
        }

        async function populateDropdowns() {
            const base = await resolveBaseUrl();
            if (!base) {
                document.getElementById('live-tv-select').disabled = true;
                document.getElementById('movies-select').disabled = true;
                showNotification('Could not reach the playlist data source.');
                return;
            }
            rawBaseUrl = base;
            baseUrl = base;
            await loadSection('liveTv');
            await loadSection('movies');
            localStorage.setItem(STORE_KEYS.status, JSON.stringify(statusCache));
            recomputeTotals();
            updateAnalytics();
        }

        const FILE_EXTENSIONS = [
            { label: 'M3U File', ext: 'm3u', type: 'm3u' },
            { label: 'JSON File', ext: 'json', type: 'json' },
            { label: 'TXT File', ext: 'txt', type: 'txt' }
        ];

        function createFileLinkItem(dir, subDir, spec, status) {
            const file = fileBaseName(dir, `LiveTV.${spec.ext}`);
            const href = fileUrl(dir, subDir, file);
            const downloadName = `${subDir}_${dir}.${spec.ext}`;

            const item = document.createElement('div');
            item.className = 'link-item';

            const badge = document.createElement('div');
            badge.className = `status-badge status-${status}`;
            badge.title = status === 'online' ? 'Server reachable' : 'Server unreachable';
            item.appendChild(badge);

            const link = document.createElement('a');
            link.href = href;
            link.target = '_blank';
            link.rel = 'noopener';
            link.textContent = spec.label;
            link.style.marginLeft = '15px';
            link.addEventListener('click', () => trackLink(dir, subDir, 'click'));
            item.appendChild(link);

            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.textContent = 'Copy';
            copyBtn.addEventListener('click', () => copyToClipboard(href, dir, subDir, spec.type));
            item.appendChild(copyBtn);

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'download-btn';
            downloadBtn.textContent = 'Download';
            downloadBtn.addEventListener('click', () => downloadFile(href, downloadName, dir, subDir));
            item.appendChild(downloadBtn);

            return item;
        }

        function createFileLinks(dir, subDir) {
            const key = `${dir}/${subDir}`;
            const status = statusCache[key]?.online ? 'online' : 'offline';
            const fragment = document.createDocumentFragment();
            for (const spec of FILE_EXTENSIONS) {
                fragment.appendChild(createFileLinkItem(dir, subDir, spec, status));
            }
            return fragment;
        }

        function showLiveTV(country) {
            const content = document.getElementById('live-tv-content');
            const moviesContent = document.getElementById('movies-content');
            content.replaceChildren();
            moviesContent.classList.remove('active');
            document.getElementById('movies-select').value = '';
            if (country) {
                content.replaceChildren(createFileLinks('LiveTV', country));
                content.classList.add('active');
                document.getElementById('live-tv-select').value = country;
            }
        }

        function showMovies(category) {
            const content = document.getElementById('movies-content');
            const liveTvContent = document.getElementById('live-tv-content');
            content.replaceChildren();
            liveTvContent.classList.remove('active');
            document.getElementById('live-tv-select').value = '';
            if (category) {
                content.replaceChildren(createFileLinks('Movies', category));
                content.classList.add('active');
                document.getElementById('movies-select').value = category;
            }
        }

        function copyToClipboard(text, dir, subDir, type) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification(`${type.toUpperCase()} link copied!`);
                trackLink(dir, subDir, 'copy');
            }).catch(err => {
                console.error('Copy failed:', err);
                showNotification('Copy failed — copy the link manually.');
            });
        }

        function saveBlob(blob, filename) {
            const objectUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = objectUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(objectUrl);
        }

        async function downloadFile(url, filename, dir, subDir) {
            // The `download` attribute is ignored for cross-origin links, so fetch the file and
            // save it as a blob. raw.githubusercontent.com allows CORS; otherwise fall back to a
            // plain navigation so the file still opens.
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                saveBlob(await response.blob(), filename);
            } catch (err) {
                console.error(`Download failed for ${url}:`, err);
                window.open(url, '_blank', 'noopener');
            }
            trackLink(dir, subDir, 'download');
        }

        function renderSearchResults(dir, kind, container, query) {
            const matches = Object.entries(contentMap[kind])
                .map(([subDir, json]) => ({
                    subDir,
                    channels: allChannelsOf(json).filter(ch => (ch.name || '').toLowerCase().includes(query))
                }))
                .filter(match => match.channels.length > 0)
                .sort((a, b) => b.channels.length - a.channels.length);
            if (matches.length === 0) return 0;

            const total = matches.reduce((sum, match) => sum + match.channels.length, 0);
            const summary = document.createElement('div');
            summary.className = 'search-summary';
            summary.textContent = `${total} channel${total === 1 ? '' : 's'} in ${matches.length} ${dir} list${matches.length === 1 ? '' : 's'}`;
            container.appendChild(summary);

            const list = document.createElement('ul');
            list.className = 'search-list';
            for (const match of matches) {
                const item = document.createElement('li');
                const open = document.createElement('button');
                open.className = 'copy-btn';
                open.textContent = match.subDir;
                open.addEventListener('click', () => {
                    if (kind === 'liveTv') showLiveTV(match.subDir);
                    else showMovies(match.subDir);
                });
                const preview = document.createElement('span');
                preview.textContent = match.channels.slice(0, 3).map(ch => ch.name).join(', ');
                const count = document.createElement('span');
                count.className = 'search-count';
                count.textContent = `${match.channels.length} match${match.channels.length === 1 ? '' : 'es'}`;
                item.append(open, preview, count);
                list.appendChild(item);
            }
            container.appendChild(list);
            container.classList.add('active');
            return matches.length;
        }

        function searchContent() {
            const query = document.getElementById('search').value.toLowerCase().trim();
            const liveTvContent = document.getElementById('live-tv-content');
            const moviesContent = document.getElementById('movies-content');
            liveTvContent.replaceChildren();
            moviesContent.replaceChildren();
            liveTvContent.classList.remove('active');
            moviesContent.classList.remove('active');
            if (!query) return;

            const found = renderSearchResults('LiveTV', 'liveTv', liveTvContent, query)
                + renderSearchResults('Movies', 'movies', moviesContent, query);
            if (found === 0) {
                liveTvContent.textContent = 'No channels or movies match your search.';
                liveTvContent.classList.add('active');
            }
        }

        const THEMES = [
            { className: 'light', icon: '☀️' },
            { className: 'pool', icon: '🌙' },
            { className: '', icon: '🌀' }
        ];

        function applyTheme(className) {
            const body = document.body;
            for (const theme of THEMES) {
                if (theme.className) body.classList.remove(theme.className);
            }
            if (className) body.classList.add(className);
            const theme = THEMES.find(candidate => candidate.className === className) || THEMES[2];
            document.querySelector('.theme-toggle').textContent = theme.icon;
        }

        function toggleTheme() {
            const body = document.body;
            const current = THEMES.find(theme => theme.className && body.classList.contains(theme.className));
            const next = THEMES[(THEMES.indexOf(current) + 1) % THEMES.length];
            applyTheme(next.className);
            localStorage.setItem(STORE_KEYS.theme, next.className);
        }

        const ACTION_FIELD = { click: 'clicks', copy: 'copies', download: 'downloads' };

        function trackLink(dir, subDir, action) {
            const field = ACTION_FIELD[action];
            if (!field) return;
            const section = analytics[sectionKey(dir)];
            const key = `${dir}/${subDir}`;
            section[key] = section[key] || { clicks: 0, copies: 0, downloads: 0 };
            section[key][field]++;
            persistAnalytics();
            if (action === 'download') {
                downloadHistory.push({ key, timestamp: new Date().toISOString() });
                localStorage.setItem(STORE_KEYS.downloads, JSON.stringify(downloadHistory));
            }
            updateAnalytics();
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            clearTimeout(showNotification.timer);
            showNotification.timer = setTimeout(() => { notification.style.display = 'none'; }, 5000);
        }

        // Called once after all sections load: compares every stored sync date against a single
        // "last visit" snapshot, then records the new one.
        function notifyUpdates() {
            const lastVisit = new Date(localStorage.getItem('last_visit') || 0);
            const updated = Object.entries(analytics.lastSync)
                .filter(([, date]) => new Date(date) > lastVisit)
                .sort((a, b) => new Date(b[1]) - new Date(a[1]));
            if (updated.length > 0) {
                const [key, date] = updated[0];
                const minutes = Math.max(1, Math.round((Date.now() - new Date(date)) / 60000));
                showNotification(`${key} updated ${minutes} min${minutes === 1 ? '' : 's'} ago!`
                    + (updated.length > 1 ? ` (+${updated.length - 1} more)` : ''));
            }
            // The footer reports the real publication moment. GitHub's cron is best
            // effort, so any fixed hour printed here would be a lie.
            const latest = Object.values(analytics.lastSync)
                .filter(date => date && !isNaN(new Date(date)))
                .sort((a, b) => new Date(b) - new Date(a))[0];
            const footer = document.getElementById('footer-updated');
            if (footer && latest) {
                footer.textContent = `last update: ${new Date(latest).toLocaleString('es-ES')}`;
            }
            localStorage.setItem('last_visit', new Date().toISOString());
        }

        const GAUGE_OPTIONS = {
            cutout: '70%',
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } }
        };

        // Chart.js refuses a second instance on the same canvas, so charts are created once and
        // then updated in place instead of being re-instantiated on every interaction.
        function ensureGauges() {
            const container = document.getElementById('gauges-container');
            if (container.childElementCount > 0) return;
            container.innerHTML = `
                <div class="gauge">
                    <canvas id="totalChannelsGauge"></canvas>
                    <div class="gauge-text" id="totalChannelsLabel"></div>
                </div>
                <div class="gauge">
                    <canvas id="listCountGauge"></canvas>
                    <div class="gauge-text" id="listCountLabel"></div>
                </div>
            `;
            charts.total = new Chart(document.getElementById('totalChannelsGauge'), {
                type: 'doughnut',
                data: { datasets: [{ data: [0, 1], backgroundColor: ['#ff007a', '#333'], borderWidth: 0 }] },
                options: GAUGE_OPTIONS
            });
            charts.lists = new Chart(document.getElementById('listCountGauge'), {
                type: 'doughnut',
                data: { datasets: [{ data: [0, 1], backgroundColor: ['#00ddeb', '#333'], borderWidth: 0 }] },
                options: GAUGE_OPTIONS
            });
        }

        function setGauge(chart, labelId, value, caption) {
            // Caption is a static string, so building the markup here cannot inject data.
            chart.data.datasets[0].data = [value, 0];
            chart.update();
            document.getElementById(labelId).innerHTML = `${Number(value).toLocaleString()}<br>${caption}`;
        }

        function updateAnalytics() {
            if (typeof Chart === 'undefined') {
                document.getElementById('leaderboard').textContent = 'Charts unavailable (Chart.js did not load).';
                return;
            }
            recomputeTotals();
            ensureGauges();

            setGauge(charts.total, 'totalChannelsLabel', analytics.totalChannels, 'Channels Loaded');
            setGauge(charts.lists, 'listCountLabel', listCount(), 'Lists Available');

            const downloadData = {};
            for (const type of ['liveTv', 'movies']) {
                for (const [key, { downloads }] of Object.entries(analytics[type])) {
                    downloadData[key] = downloads;
                }
            }

            const leaderboard = document.getElementById('leaderboard');
            const top = Object.entries(downloadData)
                .filter(([, downloads]) => downloads > 0)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);
            leaderboard.replaceChildren(...top.map(([key, downloads]) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.textContent = `${key.split('/')[1]}: ${downloads}`;
                return item;
            }));

            const historyByDay = {};
            for (const { timestamp } of downloadHistory) {
                const day = new Date(timestamp).toLocaleDateString();
                historyByDay[day] = (historyByDay[day] || 0) + 1;
            }
            const days = Object.keys(historyByDay).sort();
            const labels = days.slice(-7);
            const data = days.slice(-7).map(day => historyByDay[day]);

            if (charts.downloads) {
                charts.downloads.data.labels = labels;
                charts.downloads.data.datasets[0].data = data;
                charts.downloads.update();
            } else {
                charts.downloads = new Chart(document.getElementById('downloadChart').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Downloads',
                            data,
                            borderColor: '#ff007a',
                            backgroundColor: 'rgba(255, 0, 122, 0.2)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { beginAtZero: true, title: { display: true, text: 'Downloads', color: '#fff' } },
                            x: { title: { display: true, text: 'Date', color: '#fff' } }
                        },
                        plugins: {
                            legend: { labels: { color: '#fff' } },
                            title: { display: false }
                        }
                    }
                });
            }
        }

        function csvCell(value) {
            const text = String(value);
            return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
        }

        function exportStats() {
            const rows = [['Key', 'Clicks', 'Copies', 'Downloads', 'Last Sync'].join(',')];
            for (const type of ['liveTv', 'movies']) {
                for (const [key, { clicks, copies, downloads }] of Object.entries(analytics[type])) {
                    rows.push([key, clicks, copies, downloads, analytics.lastSync[key] || 'N/A'].map(csvCell).join(','));
                }
            }
            rows.push(csvCell('Total Channels') + ',,' + analytics.totalChannels + ',,');
            rows.push(csvCell('Lists Loaded') + ',,' + listCount() + ',,');
            saveBlob(new Blob([rows.join('\n') + '\n'], { type: 'text/csv;charset=utf-8;' }),
                `m3u_stats_${new Date().toISOString().split('T')[0]}.csv`);
        }

        function listCount() {
            return Object.values(contentMap.liveTv).length + Object.values(contentMap.movies).length;
        }

        // Initialize
        applyTheme(localStorage.getItem(STORE_KEYS.theme) || '');
        populateDropdowns();
    </script>
</body>
</html>
