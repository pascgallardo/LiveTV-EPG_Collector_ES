name: TV-Spain Update Files

on:
  schedule:
    # GitHub evaluates cron in UTC and treats `schedule` as best effort: over the
    # 978 scheduled runs this repository produced between April and September 2026,
    # the median delay was 171 min at 00:00Z, 154 min at 08:00Z and 103 min at 16:00Z,
    # and no run ever started in under 28 minutes.
    #
    # This slot was moved back 8 hours, from 16:00Z to 08:00Z, to publish the lists
    # earlier in the day. The delay is paid either way -- it is a queue, not a fixed
    # offset -- so moving the cron 8 h earlier moves the publication 8 h earlier and
    # nothing else. 08:00Z does queue somewhat harder than 16:00Z (median 154 min vs
    # 103 min), which costs about 50 min of that margin, but the lists now land in
    # the middle of the Spanish afternoon instead of late at night.
    #
    # There is deliberately no time gate. A gate could never pass: the shortest delay
    # ever observed was 28 min, so a +/-30 min window would have rejected ~99% of the
    # runs and the workflow would never update anything. Instead the collector stamps
    # LiveTV.json with the moment it really ran, and index.html shows the real
    # "updated N min ago" from it. Expect publication roughly between 11:30 and 15:30
    # mainland Spain time, plus up to ~2h of slack.
    - cron: '0 8 * * *'
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Record the real publication time
        run: |
          echo "Scheduled for 08:00 UTC, starting now."
          echo "UTC:   $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Madrid: $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Run TV-Spain M3U collector script
        run: python BugsfreeMain/TV-Spain.py

      - name: Commit and push changes
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add LiveTV/Spain/LiveTV.m3u LiveTV/Spain/LiveTV.txt LiveTV/Spain/LiveTV.json LiveTV/Spain/LiveTV
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "TV-Spain Update files - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase --autostash origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

  update-indexes:
    needs: update-files
    # Use the reusable workflow from this repository. The upstream one hardcodes
    # `git add LiveTV/index.json Movies/index.json`, and this fork has no Movies/
    # directory, so `git add` exits 128 and fails the job.
    uses: ./.github/workflows/update-indexes.yml
    permissions:
      contents: write  # Required for the called workflow to push changes
